{# templates/admin/index.html #}
{% extends "base.html" %}

{% block title %}首页 - RAG 后台系统{% endblock %}

{% block content %}
<div class="container-fluid">
    <h2 class="mt-3 mb-4">控制台</h2>

    <div class="row g-3">
        <div class="col-md-3">
            <div class="card text-white bg-primary">
                <div class="card-body">
                    <h5 class="card-title"><i class="bi bi-database"></i> 知识库</h5>
                    <p class="card-text display-4">{{ kb_count }}</p>
                    <a href="{{ url_for('admin.knowledge_bases') }}" class="text-white">查看详情 &raquo;</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-success">
                <div class="card-body">
                    <h5 class="card-title"><i class="bi bi-file-text"></i> 文档</h5>
                    <p class="card-text display-4">{{ doc_count }}</p>
                    <a href="{{ url_for('document.all_documents') }}" class="text-white">查看详情 &raquo;</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white" style="background:#0f766e;">
                <div class="card-body">
                    <h5 class="card-title"><i class="bi bi-stars"></i> 智能助手</h5>
                    <p class="card-text display-4">{{ assistant_count }}</p>
                    <a href="{{ url_for('admin.smart_assistants') }}" class="text-white">查看详情 &raquo;</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-info">
                <div class="card-body">
                    <h5 class="card-title"><i class="bi bi-people"></i> 用户</h5>
                    <p class="card-text display-4">{{ user_count }}</p>
                    <a href="{{ url_for('admin.users') }}" class="text-white">查看详情 &raquo;</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
